<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mahmoudverse</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Grain Overlay -->
    <div class="grain-overlay"></div>

    <!-- Background Elements -->
    <div class="space-background">
        <div class="stars layer1"></div>
        <div class="stars layer2"></div>
        <div class="stars layer3"></div>
        <div class="nebula-glow"></div>
        
        <div id="shootingStarsContainer"></div>
        <div id="particlesContainer"></div>
    </div>

    <!-- Main Content -->
    <main class="cinematic-container">
        <div class="face-area">
            <div class="eyes-image-container" id="eyesContainer">
                <img src="eyes.png" alt="realistic eyes" class="eyes-img">
                
                <!-- Animated Eyelids (overlaying the image) -->
                <div class="eyelid top-lid" id="topLid"></div>
                <div class="eyelid bottom-lid" id="bottomLid"></div>
                
                <!-- Shadows to blend the image edges -->
                <div class="vignette"></div>
            </div>
            
            <div class="text-area">
                <p class="emotional-text flicker">u didn't appreciate what i did for u</p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
