<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHMOUDVERSE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Grain Overlay -->
    <div class="grain-overlay"></div>

    <!-- Background Image -->
    <div class="background-container">
        <img src="samurai.jpg" alt="samurai background" class="bg-img">
        <div class="vignette"></div>
    </div>

    <!-- Main Content -->
    <main class="cinematic-container">
        <div class="interaction-area">
            <button id="toggleMessageBtn" class="primary-btn">send a hidden message</button>
            <div id="upsetMessage" class="upset-msg" style="display: none;">انا زعلان منك لانك مبعتش رساله في اول مره 😠</div>
            
            <div id="messageModal" class="modal-overlay">
                <div class="modal-content">
                    <textarea id="hiddenMessage" placeholder="type your message here..." spellcheck="false"></textarea>
                    <div class="modal-actions">
                        <button id="sendBtn" class="action-btn">execute</button>
                        <button id="closeBtn" class="secondary-btn">cancel</button>
                    </div>
                    <p id="feedback" class="feedback-msg"></p>
                </div>
            </div>
        </div>
    </main>



    <script src="script.js"></script>
</body>
</html>
