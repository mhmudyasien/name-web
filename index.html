<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoPulse | Premium Asset Intelligence</title>
    <meta name="description" content="Master your digital assets with the most advanced real-time crypto intelligence dashboard.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
        <div class="vignette"></div>
    </div>

    <!-- Main Content -->
    <main class="cinematic-container">
        <div class="interaction-area">
            <button id="toggleMessageBtn" class="primary-btn">send a hidden message</button>
            <div id="upsetMessage" class="upset-msg" style="display: none;">i'm actually tight u didn't send a message the first time</div>
            
            <div id="messageModal" class="modal-overlay">
                <div class="modal-content">
                    <textarea id="hiddenMessage" placeholder="type your message here..." spellcheck="false"></textarea>
                    <div class="modal-actions">
                        <button id="sendBtn" class="action-btn">execute</button>
                        <button id="closeBtn" class="secondary-btn">cancel</button>
                    </div>
                    <p id="feedback" class="feedback-msg"></p>
                </div>
            </div>
        </div>
    </main>



    <script src="script.js"></script>
</body>
</html>
