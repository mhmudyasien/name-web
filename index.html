<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Access</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for futuristic, electronic typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background Elements -->
    <div class="space-background">
        <div class="stars layer1"></div>
        <div class="stars layer2"></div>
        <div class="stars layer3"></div>
        
        <div class="shooting-star" style="top: 10%; left: 80%; animation-delay: 0s;"></div>
        <div class="shooting-star" style="top: 30%; left: 90%; animation-delay: 6s;"></div>
        <div class="shooting-star" style="top: 5%; left: 50%; animation-delay: 12s;"></div>
    </div>

    <!-- Main Container -->
    <main class="container fade-in" id="mainContent">
        <div class="terminal-interface">
            <h1 class="prompt-text">enter ur name<span class="blinking-cursor">_</span></h1>
            
            <div class="input-wrapper">
                <span class="prompt-symbol">></span>
                <input type="text" id="nameInput" autocomplete="off" spellcheck="false" autofocus>
            </div>
            
            <p class="error-message" id="errorMessage"></p>
            
            <button id="submitBtn" class="text-button">[ execute ]</button>
        </div>
    </main>

    <!-- Success Popup -->
    <div class="terminal-popup" id="successPopup">
        <div class="success-content">
            <p class="success-line1">i love you habiba :)</p>
            <p class="success-line2">i will marry you isa :')</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
