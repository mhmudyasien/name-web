<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHMOUDVERSE v2.5.0</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Grain Overlay -->
    <div class="grain-overlay"></div>

    <!-- UI Frame: Top Bar -->
    <header class="terminal-header">
        <div class="header-left">MAHMOUDVERSE <span class="version">v2.5.0</span></div>
        <div class="header-right">
            <span class="visitor">[ VISITOR ] UNKNOWN</span>
            <span class="ip">IP 0.0.0.0</span>
            <span class="status-dot"></span>
        </div>
    </header>

    <!-- UI Frame: Brackets/Corners -->
    <div class="ui-brackets"></div>

    <!-- Background Elements -->
    <div class="space-background">
        <div class="stars layer1"></div>
        <div class="stars layer2"></div>
        <div class="nebula-purple"></div>
        
        <div id="shootingStarsContainer"></div>
        <div id="particlesContainer"></div>
    </div>

    <!-- Main Content -->
    <main class="cinematic-container">
        <div class="face-area">
            <div class="star-container" id="starContainer">
                <img src="star.png" alt="shining star" class="star-img">
                <div class="star-glow-outer"></div>
                <div class="star-glow-inner"></div>
            </div>
            
            <div class="text-area">
                <p class="emotional-text">"u didn't appreciate what i did for u"</p>
                <div class="text-indicator">_</div>
            </div>
        </div>
    </main>

    <!-- UI Frame: Bottom Bar -->
    <footer class="terminal-footer">
        <div class="footer-left">> SYSTEM_STATUS: OBSERVING...</div>
        <div class="footer-right">> CONNECTION: STABLE</div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
